# ==========================================
# Stream2segment download configuration file
# ==========================================

# This file is written in YAML syntax. For info see: http://docs.ansible.com/ansible/latest/YAMLSyntax.html


# Database URL where to save downloaded data, either SQLite (local file db) or Postgres
# (local or remote db. With postgres, the database must have been created beforehand). We
# suggest sqlite for small to medium data or enough system RAM (as a rule of thumb:
# less than a million segments, and/or more than 8GB of RAM) and postgres otherwise.
# For info see: http://docs.sqlalchemy.org/en/latest/core/engines.html#database-urls
dburl: 'sqlite:///<local_file_path>'  # or, e.g.: postgresql://<user>:<password>@<host>/<dbname>

# Download events (and data) on or after the specified time. Type an ISO-formatted
# date, date-time string, or an integer in days, where 0 is the start of the current day.
# E.g., starttime: -1 and endtime: 0 means: fetch events occurred yesterday
starttime: 2006-01-01T00:00:00

# Download events (and data) on or before the specified time. Type an ISO-formatted
# date, date-time string, or an integer in days, where 0 is the start of the current day.
# E.g., starttime: -1 and endtime: 0 means: fetch events occurred yesterday
endtime: 2016-12-25T00:00:00


# =======
# Events: https://www.fdsn.org/webservices/FDSN-WS-Specifications-1.2.pdf#page=15
# =======

# The event catalog in form of FDSN URL or local file path. You can supply a string
# or list of strings, but be careful not to provide several urls with broad parameters.
# The events list, returned by the URL or in the supplied file, must be in FDSN format
# (https://www.fdsn.org/webservices/FDSN-WS-Specifications-1.2.pdf#page=15).
# You can also type these shortcut strings instead of URLs:
# 'emsc':  'http://www.seismicportal.eu/fdsnws/event/1/query'
# 'isc':   'http://www.isc.ac.uk/fdsnws/event/1/query'
# 'iris':  'http://service.iris.edu/fdsnws/event/1/query'
# 'ncedc': 'http://service.ncedc.org/fdsnws/event/1/query'
# 'scedc': 'http://service.scedc.caltech.edu/fdsnws/event/1/query'
# 'usgs':  'http://earthquake.usgs.gov/fdsnws/event/1/query'
events_url: 'https://seismicportal.eu/fdsnws/event/1/query'

# NOTE: all event parameters below are ignored if missing, empty, null, or
# 'events_url' is  given as file path

# Limit to events with a latitude larger than or equal to the specified minimum.
minlatitude: 47.0

# Limit to events with a latitude smaller than or equal to the specified maximum
maxlatitude: 57.0

# Limit to events with a longitude larger than or equal to the specified minimum
minlongitude: 4.0

# Limit to events with a longitude smaller than or equal to the specified maximum
maxlongitude: 17.0

# Limit to events with depth more than the specified minimum
mindepth: 1

# Limit to events with depth less than the specified maximum
maxdepth: 50

# Limit to events with a magnitude larger than the specified minimum
minmagnitude: 4.0

# Limit to events with a magnitude smaller than the specified maximum
maxmagnitude: null

# Event parameters in addition to those already provided above. These are usually for
# refined searches and can be provided as YAML Mapping of indented "param: value" pairs.
# For info see https://www.fdsn.org/webservices/FDSN-WS-Specifications-1.2.pdf#page=15
# Note that parameters with support 'Optional' at the link above are not guaranteed to
# work. The 'format' parameter will be ignored as it is automatically set by the program
events_extra_params:
  # lat: 47.0
  # lon: 4.0
  # minradius: 17.0
  # maxradius: 21.0

# Download QuakeML for each event. Set to false unless if you absolutely need accurate
# event information in your processing routine (e.g. phase arrivals,  moment tensor or
# focal mechanism information, multiple origins and magnitudes)
quakeml: false


# ====================
# Stations / Channels: https://www.fdsn.org/webservices/FDSN-WS-Specifications-1.2.pdf#page=11
# ====================

# NOTE: the station URL(s) are configurable in `data_url` (see below). If multiple URLs
# return the same station code, the program will attempt to resolve them
# (for eida nodes using routing_service_url in advanced_settings or from already saved
# stations). In case of unresolved conflicts, the station will be discarded and all its
# available waveforms not downloaded (check log messages for details).

# Limit the search to the specified channels (if missing, defaults to '*', i.e. fetch all
# channels). You can also filter out specific channels by placing the negation character
# "!" in front of them. Being non-standard FDSN syntax, the negation is applied after the
# data is downloaded. Pay attention to inconsistencies, e.g. "!B*,BHZ" will first fetch
# all channels "BHZ" and then remove all channels starting with "B" ("!B*").
# Implementation details: You can also specify a YAML sequence of strings instead of
# comma-separated strings. E.g., these are equivalent:
# channels: "A,B"
# cha: [ "A" , "B" ]
# channel:
#  - "A"
#  - "B"
channel:
 - "HH?"
 - 'HN?'
 - 'HL?'
 
# Limit the search to the specified networks (see 'channel' parameter for details)
network: '*'

# Limit the search to the specified stations (see 'channel' parameter for details)
station: '*'

# Limit the search to the specified locations (see 'channel' parameter for details)
location: '*'

# Limit the search to channels with at least the following sample rate (in Hz).
# The relative segments will most likely (but not always) match the channel sample rate.
# Set to 0 or negative number to ignore the sampling rate
min_sample_rate: 60

# Download stationxml. Set to false only if you simply need raw unprocessed waveform
# segments (e.g., no conversion from digital samples into physical units)
stationxml: true

# search radius: defines the criteria for selecting stations around events. It is a dict
# which can have either:
# 1) two arguments ('min', 'max'), to select stations within 'min' and 'max' degrees
# (endpoints included) from each event location (type min=0 for a circular search area)
# 2) four arguments, to select stations within a circular area whose radius is dependent
# on the event magnitude:
#
#                   |
#     maxmag_radius +                oooooooooooo
#                   |              o
#                   |            o
#                   |          o
#     minmag_radius + oooooooo
#                   |
#                   ---------+-------+------------
#                         minmag   maxmag
# If minmag = maxmag = M, `maxmag_radius` will be used for events with magnitude >= M,
# `minmag_radius` otherwise
search_radius:
  minmag: 6 # min magnitude
  maxmag: 7 # max magnitude
  minmag_radius: 3 # search radius for min mag (deg)
  maxmag_radius: 3 # search radius for max mag (deg)
  # min: 0  # min radius (deg)
  # max: 3  # max radius (deg)


# ========================
# Data (waveform segments) https://www.fdsn.org/webservices/FDSN-WS-Specifications-1.2.pdf#page=9
# ========================

# List of URLs for downloading waveform data segments. All URLs must be
# FDSN-compliant (e.g.: https://service.iris.edu/fdsnws/dataselect/1/query). You can also
# type two special values: 1) "iris" (Incorporated Research Institutions for Seismology),
# shortcut for the URL above or 2) "eida", shortcut for several nodes - or data centers -
# of the European Integrated Data Archive. Being FDSN compliant, all URLs are also used
# to fetch automatically the necessary metadata (stations and channels)
data_url:
  - 'eida'
  # - 'iris'

# The segment's time window to download: specify two floats denoting the start and end
# time, in minutes relative to the calculated arrival time (as such, start time is
# usually negative). Note that 3.5 means 3 minutes 30 seconds, and each segment window
# will be eventually rounded to the nearest second.
time_window:
  - -1.0
  - 3.0

# Credentials to download restricted data. When null, missing or "", only open waveforms
# will be downloaded. When provided, it can be either a list of two strings (username and
# password), or, for EIDA node(s), a string denoting the path of a token file (see
# https://geofon.gfz-potsdam.de/waveform/archive/auth/auth-overview.php for details).
# IMPORTANT: with credentials, the download must be targeted to a single data URL, and
# preferably to the specific network, station or time period of interest (you might
# also want to set `max_concurrent_downloads` in `advanced_settings` to 1 or 2)
credentials: ""


# =====================================
# Advanced settings (for experts only) 
# =====================================

advanced_settings:
  # Maximum number of concurrent downloads per data URL. If set to null, concurrency
  # is tuned automatically for optimal performance. Higher values may speed up downloads
  # but can lead to throttling or failures (e.g. "Too Many Requests", "Service Unavailable")
  # depending on the data center. Use low values (1–2) to reduce server load and improve
  # reliability, especially for restricted data or after repeated errors.
  max_concurrent_downloads: null
  # Routing service used to fetch EIDA nodes and relative network/stations. If list of
  # URLs, then each url will be queried in the given order, stopping when the first one
  # provides valid data
  routing_service_url:
    - "https://www.orfeus-eu.org/eidaws/routing/1/query"
    - "https://geofon.gfz.de/eidaws/routing/1/query"
  # Max time to wait (in s) for a single request while downloading text (FDSN events,
  # channels). Can be slightly increased, as text requests are rarely the main bottleneck
  text_download_timeout: 120
  # Max time to wait (in s) for a single request while downloading data (MiniSEED, XML).
  # Keep low to avoid unnecessary delays in large-scale downloads
  data_download_timeout: 30
  # Travel-time model used to compute waveform arrival times. The models are precomputed
  # grids optimized for speed; typical errors are under 0.5 s and negligible with respect
  # to the `time_window` parameter. Type one of the 4 built-in grids:
  #   ak135_ttp+: ak135 model for all ttp+ phases (P wave arrivals)
  #   ak135_tts+: ak135 model for all tts+ phases (S wave arrivals)
  #   iasp91_ttp+: iasp91 model for all ttp+ phases (P wave arrivals)
  #   iasp91_tts+: iasp91 model for all tts+ phases (S wave arrivals)
  traveltimes_model: 'ak135_ttp+'
  # Spatio-temporal tolerance used to detect overlapping events that may produce
  # duplicate waveforms. If events overlap and share the same magnitude type => keep the highest
  # magnitude; otherwise resolution follows `on_event_conflict`.
  event_overlap_tolerance:
    lat: 5 # in km
    lon: 5 # in km
    depth: 5  # in km
    time: 30  # in s
  # What to do with overlapping events: "keep", "discard", or a single / comma-separated
  # list of preferred magnitude types (e.g. "Mw,Mb"). If no preferred magnitude type is
  # found, all events are kept.
  on_event_conflict: "keep"